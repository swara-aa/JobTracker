<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Job Tracker</title>
    <style>
      :root { color: #f6f2ff; background: #161831; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; background:radial-gradient(circle at top left,rgba(166,113,255,.42),transparent 32%),radial-gradient(circle at 82% 10%,rgba(57,228,242,.22),transparent 28%),linear-gradient(135deg,#17162e 0%,#202342 48%,#111426 100%); }
      main { width: min(100%, 440px); padding: 42px; border: 1px solid #514b78; border-radius: 24px; background: rgba(37,39,68,.94); box-shadow: 0 24px 60px rgba(6,8,24,.34); }
      h1 { margin: 0 0 10px; font-size: 2rem; }
      p { color: #b9b5d8; line-height: 1.5; }
      label { display: block; margin: 28px 0 8px; font-weight: 700; }
      input { width: 100%; padding: 13px; border: 1px solid #514b78; border-radius: 12px; background:#202342; color:#f6f2ff; font: inherit; }
      button { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 12px; background: linear-gradient(135deg,#39e4f2,#bd5fff 58%,#f35acb); color: #0d1024; cursor: pointer; font: inherit; font-weight: 800; }
      .error { color: #ffbdd0; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Job Tracker</h1>
      <p>This private workspace contains your job-search data.</p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="password">Access password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
